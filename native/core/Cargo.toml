[package]
name = "gmpublisher-core"
version = "3.0.0-alpha.0"
description = "GMA reading, writing and extraction for gmpublisher"
authors = ["William Venner <william@venner.io>"]
license = "GPL-3.0"
edition = "2021"
publish = false

[dependencies]
crc32fast = "1"
lzma-rs = "0.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
walkdir = "2"

[dev-dependencies]
tempfile = "3"
