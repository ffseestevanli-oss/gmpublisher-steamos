name: linux-appimage

# Portable Linux build for immutable distros (SteamOS, Bazzite, Fedora Atomic, ...).
# The AppImage bundles WebKitGTK and libsteam_api.so, so nothing has to be installed system-wide.

on:
  push:
    branches: ["**"]
    tags: ["*.*.*"]
  pull_request:
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

jobs:
  appimage:
    runs-on: ubuntu-latest
    # Tauri 1 needs webkit2gtk-4.0, which Ubuntu 22.04 is the last LTS to ship.
    # Building on an older glibc also keeps the AppImage compatible with more distros.
    container: ubuntu:22.04
    permissions:
      contents: write
    env:
      # No FUSE inside the container; let linuxdeploy run by extracting itself
      APPIMAGE_EXTRACT_AND_RUN: "1"
    steps:
      - name: Install system dependencies
        run: |
          apt-get update
          DEBIAN_FRONTEND=noninteractive apt-get install -y \
            build-essential curl wget file git ca-certificates \
            libwebkit2gtk-4.0-dev libgtk-3-dev libayatana-appindicator3-dev \
            librsvg2-dev libssl-dev patchelf

      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Rust
        run: |
          curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y --profile minimal --default-toolchain none
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"

      - name: Install NPM dependencies
        run: npm install

      - name: Build AppImage
        run: |
          # Let linuxdeploy resolve libsteam_api.so (copied here by copySharedLibs.js) so it gets bundled
          export LD_LIBRARY_PATH="$GITHUB_WORKSPACE/src-tauri/target/release"
          npm run tauri build -- --bundles appimage -v

      - name: Strip graphics-stack libraries from the AppImage
        run: |
          # Bundled Wayland libraries clash with the host's Mesa/NVIDIA EGL drivers and make WebKit abort with
          # "Could not create default EGL display: EGL_BAD_PARAMETER" (blank window on SteamOS / Bazzite).
          # These must always come from the host system.
          cd src-tauri/target/release/bundle/appimage
          echo "Bundled libraries:"; ls gmpublisher.AppDir/usr/lib
          find gmpublisher.AppDir -name 'libwayland-*.so*' -print -delete

          wget -q https://github.com/AppImage/appimagetool/releases/download/continuous/appimagetool-x86_64.AppImage
          chmod +x appimagetool-x86_64.AppImage
          APPIMAGE=$(ls gmpublisher_*.AppImage)
          rm "$APPIMAGE"
          ARCH=x86_64 ./appimagetool-x86_64.AppImage --no-appstream gmpublisher.AppDir "$APPIMAGE"
          rm appimagetool-x86_64.AppImage

      - name: Verify AppImage
        run: |
          cd src-tauri/target/release/bundle/appimage
          APPIMAGE=$(ls gmpublisher_*.AppImage)
          chmod +x "$APPIMAGE"
          ./"$APPIMAGE" --appimage-extract > /dev/null

          test -f squashfs-root/usr/lib/libsteam_api.so || { echo "libsteam_api.so is not bundled"; exit 1; }
          if find squashfs-root -name 'libwayland-*.so*' | grep .; then
            echo "Wayland libraries must not be bundled"
            exit 1
          fi

          # Every shared library must resolve without LD_LIBRARY_PATH
          unset LD_LIBRARY_PATH
          if ldd squashfs-root/usr/bin/gmpublisher | grep "not found"; then
            echo "Unresolved libraries in the AppImage"
            exit 1
          fi

          # Run from another directory to make sure nothing depends on the working directory
          (cd / && "$OLDPWD/$APPIMAGE" --appimage-extract-and-run --version)

          mv "$APPIMAGE" "$GITHUB_WORKSPACE/gmpublisher_linux_x86_64.AppImage"

      - uses: actions/upload-artifact@v4
        with:
          name: gmpublisher_linux_x86_64.AppImage
          path: gmpublisher_linux_x86_64.AppImage

      - name: Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: gmpublisher_linux_x86_64.AppImage
          fail_on_unmatched_files: true

  fedora-debug:
    needs: appimage
    runs-on: ubuntu-latest
    container: fedora:latest
    steps:
      - name: Install Fedora desktop libraries
        run: |
          dnf install -y -q gtk3 mesa-dri-drivers mesa-libEGL mesa-libGL xorg-x11-server-Xvfb xorg-x11-xauth \
            ImageMagick dbus-x11 procps-ng weston which glibc-langpack-en fontconfig google-noto-sans-fonts > /dev/null
          cat /etc/os-release | head -2
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: gmpublisher_linux_x86_64.AppImage
      - name: Render tests
        run: bash .github/debug/fedora-smoke.sh "$PWD/gmpublisher_linux_x86_64.AppImage"
