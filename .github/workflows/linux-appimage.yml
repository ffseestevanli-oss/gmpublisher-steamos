name: linux-appimage

# Portable Linux build for immutable distros (SteamOS, Bazzite, Fedora Atomic, ...).
# The AppImage bundles WebKitGTK and libsteam_api.so, so nothing has to be installed system-wide.

on:
  push:
    branches: ["**"]
    tags: ["*.*.*"]
  pull_request:
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

jobs:
  appimage:
    runs-on: ubuntu-latest
    # Tauri 1 needs webkit2gtk-4.0, which Ubuntu 22.04 is the last LTS to ship.
    # Building on an older glibc also keeps the AppImage compatible with more distros.
    container: ubuntu:22.04
    permissions:
      contents: write
    env:
      # No FUSE inside the container; let linuxdeploy run by extracting itself
      APPIMAGE_EXTRACT_AND_RUN: "1"
    steps:
      - name: Install system dependencies
        run: |
          apt-get update
          DEBIAN_FRONTEND=noninteractive apt-get install -y \
            build-essential curl wget file git ca-certificates \
            libwebkit2gtk-4.0-dev libgtk-3-dev libayatana-appindicator3-dev \
            librsvg2-dev libssl-dev patchelf

      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Rust
        run: |
          curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y --profile minimal --default-toolchain none
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"

      - name: Install NPM dependencies
        run: npm install

      - name: Build AppImage
        run: |
          # Let linuxdeploy resolve libsteam_api.so (copied here by copySharedLibs.js) so it gets bundled
          export LD_LIBRARY_PATH="$GITHUB_WORKSPACE/src-tauri/target/release"
          npm run tauri build -- --bundles appimage -v

      - name: Strip graphics-stack libraries from the AppImage
        run: |
          # Bundled Wayland libraries clash with the host's Mesa/NVIDIA EGL drivers and make WebKit abort with
          # "Could not create default EGL display: EGL_BAD_PARAMETER" (blank window on SteamOS / Bazzite).
          # These must always come from the host system.
          cd src-tauri/target/release/bundle/appimage
          echo "Bundled libraries:"; ls gmpublisher.AppDir/usr/lib
          find gmpublisher.AppDir -name 'libwayland-*.so*' -print -delete

          wget -q https://github.com/AppImage/appimagetool/releases/download/continuous/appimagetool-x86_64.AppImage
          chmod +x appimagetool-x86_64.AppImage
          APPIMAGE=$(ls gmpublisher_*.AppImage)
          rm "$APPIMAGE"
          ARCH=x86_64 ./appimagetool-x86_64.AppImage --no-appstream gmpublisher.AppDir "$APPIMAGE"
          rm appimagetool-x86_64.AppImage

      - name: Verify AppImage
        run: |
          cd src-tauri/target/release/bundle/appimage
          APPIMAGE=$(ls gmpublisher_*.AppImage)
          chmod +x "$APPIMAGE"
          ./"$APPIMAGE" --appimage-extract > /dev/null

          test -f squashfs-root/usr/lib/libsteam_api.so || { echo "libsteam_api.so is not bundled"; exit 1; }
          if find squashfs-root -name 'libwayland-*.so*' | grep .; then
            echo "Wayland libraries must not be bundled"
            exit 1
          fi

          # Every shared library must resolve without LD_LIBRARY_PATH
          unset LD_LIBRARY_PATH
          if ldd squashfs-root/usr/bin/gmpublisher | grep "not found"; then
            echo "Unresolved libraries in the AppImage"
            exit 1
          fi

          # Run from another directory to make sure nothing depends on the working directory
          (cd / && "$OLDPWD/$APPIMAGE" --appimage-extract-and-run --version)

          mv "$APPIMAGE" "$GITHUB_WORKSPACE/gmpublisher_linux_x86_64.AppImage"

      - name: Package tarball for the Distrobox installer
        run: |
          mkdir -p pkg
          cp src-tauri/target/release/gmpublisher src-tauri/target/release/libsteam_api.so pkg/
          cp src-tauri/icons/128x128.png pkg/gmpublisher.png
          tar -czf gmpublisher_linux_x86_64.tar.gz -C pkg .
          tar -tzf gmpublisher_linux_x86_64.tar.gz

      - uses: actions/upload-artifact@v4
        with:
          name: gmpublisher_linux_x86_64.AppImage
          path: gmpublisher_linux_x86_64.AppImage

      - uses: actions/upload-artifact@v4
        with:
          name: gmpublisher_linux_x86_64.tar.gz
          path: gmpublisher_linux_x86_64.tar.gz

      - name: Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            gmpublisher_linux_x86_64.AppImage
            gmpublisher_linux_x86_64.tar.gz
          fail_on_unmatched_files: true

  distrobox:
    # Install through scripts/install-distrobox.sh exactly as a user would, then launch the app on a virtual display
    needs: appimage
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: gmpublisher_linux_x86_64.tar.gz

      - name: Install podman, distrobox and a virtual display
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq podman xvfb imagemagick xdotool > /dev/null
          curl -fsSL https://raw.githubusercontent.com/89luca89/distrobox/1.8.1.2/install | sh -s -- --prefix "$HOME/.local"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Run the installer
        run: GMPUBLISHER_TARBALL="$PWD/gmpublisher_linux_x86_64.tar.gz" bash scripts/install-distrobox.sh

      - name: Launch
        run: |
          ~/.local/bin/gmpublisher --version
          xvfb-run -a -s "-screen 0 1280x800x24" sh -c '
            ~/.local/bin/gmpublisher > app.log 2>&1 &
            sleep 45; import -window root shot.png
            pkill -f gmpublisher-app/gmpublisher || true'
          grep -v -E '^\s+"|S_API|dlopen|steamclient|with error|^\]|whitelist' app.log | head -40
          COLOURS=$(convert shot.png -format '%k' info:)
          echo "Screenshot has $COLOURS colours"
          mkdir -p results && convert shot.png -resize 800x500 results/distrobox.png && cp app.log results/
          test "$COLOURS" -gt 100 || { echo "The window did not render"; exit 1; }

      - name: Publish screenshot to the debug-results branch
        if: always()
        run: |
          cd results
          git init -q -b debug-results
          git config user.name ci; git config user.email ci@localhost
          git add -A; git commit -qm "Distrobox results for ${GITHUB_SHA}"
          git push -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}" debug-results
