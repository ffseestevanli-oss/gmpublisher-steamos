name: native

# Native Qt 6 / Kirigami edition (Rust + C++ via cxx-qt). Built against an older Qt 6 so it runs on
# the newer Qt that KDE Plasma ships on SteamOS and Bazzite, then smoke-tested on both distro families.

on:
  push:
    branches: ["**"]
    paths: ["native/**", ".github/workflows/native.yml"]
    tags: ["native-*"]
  pull_request:
    paths: ["native/**", ".github/workflows/native.yml"]
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    defaults:
      run:
        working-directory: native
    steps:
      - uses: actions/checkout@v4

      - name: Install Qt 6
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq qt6-base-dev qt6-declarative-dev qmake6 libgl-dev > /dev/null

      - uses: dtolnay/rust-toolchain@stable

      - name: Test
        run: cargo test --release

      - name: Build
        run: cargo build --release

      - name: Package
        run: |
          mkdir -p dist/gmpublisher
          cp target/release/gmpublisher packaging/install.sh packaging/io.github.ffseestevanli_oss.gmpublisher.* packaging/gmpublisher-servicemenu.desktop dist/gmpublisher/
          cp "$(find target/release -name libsteam_api.so | head -1)" dist/gmpublisher/
          tar -czf gmpublisher_native_linux_x86_64.tar.gz -C dist gmpublisher
          tar -tzvf gmpublisher_native_linux_x86_64.tar.gz

      - uses: actions/upload-artifact@v4
        with:
          name: gmpublisher_native_linux_x86_64
          path: native/gmpublisher_native_linux_x86_64.tar.gz

      - name: Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: native/gmpublisher_native_linux_x86_64.tar.gz
          prerelease: true
          fail_on_unmatched_files: true

  smoke-test:
    needs: build
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - distro: fedora   # Bazzite's base
            image: fedora:latest
            install: dnf install -y -q qt6-qtbase-gui qt6-qtdeclarative kf6-kirigami kf6-qqc2-desktop-style mesa-dri-drivers git xorg-x11-server-Xvfb xorg-x11-xauth ImageMagick google-noto-sans-fonts dbus-x11 which > /dev/null
          - distro: arch     # SteamOS's base
            image: archlinux:latest
            install: pacman -Syu --noconfirm --quiet qt6-declarative kirigami qqc2-desktop-style mesa git xorg-server-xvfb xorg-xauth imagemagick noto-fonts which > /dev/null
    container: ${{ matrix.image }}
    permissions:
      contents: write
    steps:
      - name: Install the desktop's Qt and Kirigami
        run: ${{ matrix.install }}

      - uses: actions/download-artifact@v4
        with:
          name: gmpublisher_native_linux_x86_64

      - name: Install as a user would
        run: |
          tar -xzf gmpublisher_native_linux_x86_64.tar.gz
          ./gmpublisher/install.sh
          ldd ~/.local/share/gmpublisher-native/gmpublisher | grep -E "not found|steam_api"

      - name: Command-line round trip
        run: |
          mkdir -p fixture/myaddon/lua/autorun fixture/myaddon/materials
          echo 'print("hello from CI")' > fixture/myaddon/lua/autorun/hello.lua
          echo '"VertexLitGeneric" {}' > fixture/myaddon/materials/logo.vmt
          echo '{"title":"CI Test Addon","type":"tool","tags":["fun","build"],"ignore":[]}' > fixture/myaddon/addon.json
          ~/.local/bin/gmpublisher pack fixture/myaddon
          ~/.local/bin/gmpublisher list fixture/myaddon.gma
          ~/.local/bin/gmpublisher extract fixture/myaddon.gma fixture/extracted
          for f in lua/autorun/hello.lua materials/logo.vmt; do
            test "$(cat fixture/myaddon/$f)" = "$(cat fixture/extracted/$f)" || { echo "$f differs after extraction"; exit 1; }
          done
          # A pretend Garry's Mod install with one legacy addon and one Workshop download
          GMOD=~/.local/share/Steam/steamapps/common/GarrysMod/garrysmod/addons
          WORKSHOP=~/.local/share/Steam/steamapps/workshop/content/4000/104691717
          mkdir -p $GMOD $WORKSHOP
          cp fixture/myaddon.gma $GMOD/legacy_addon.gma
          cp fixture/myaddon.gma $WORKSHOP/workshop_item.gma

      - name: Launch and screenshot
        run: |
          mkdir -p results
          shoot() {
            NAME=$1; shift
            xvfb-run -a -s "-screen 0 1280x800x24" sh -c '
              QT_FORCE_STDERR_LOGGING=1 ~/.local/bin/gmpublisher "$@" > app.log 2>&1 &
              APP=$!
              sleep 15; import -window root shot.png
              kill $APP || true' sh "$@"
            grep -v -E "S_API|steamclient|dlopen|with error" app.log | head -40
            COLOURS=$(magick shot.png -format '%k' info: 2>/dev/null || convert shot.png -format '%k' info:)
            echo "$NAME screenshot has $COLOURS colours"
            (magick shot.png -resize 800x500 results/${{ matrix.distro }}-$NAME.png 2>/dev/null || convert shot.png -resize 800x500 results/${{ matrix.distro }}-$NAME.png)
            cp app.log results/${{ matrix.distro }}-$NAME.log
            test "$COLOURS" -gt 50 || { echo "The $NAME window did not render"; exit 1; }
          }
          shoot installed
          shoot gma "$PWD/fixture/myaddon.gma"

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: screenshot-${{ matrix.distro }}
          path: results

      - name: Publish screenshot (temporary, for remote debugging)
        if: always()
        run: |
          cd results
          git init -q -b debug-native-${{ matrix.distro }}
          git config user.name ci; git config user.email ci@localhost
          git add -A; git commit -qm "Native smoke test for ${GITHUB_SHA}"
          git push -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}" debug-native-${{ matrix.distro }}
